name: Backend checks

on:
  push:
    branches: [main]
    paths:
      - "ToplineMobile-saver/**"
      - ".github/workflows/backend-checks.yml"
  pull_request:
    paths:
      - "ToplineMobile-saver/**"
      - ".github/workflows/backend-checks.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ToplineMobile-saver
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ToplineMobile-saver/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run backend tests
        run: npm test
      - name: Check server JavaScript syntax
        run: |
          find server -type f -name "*.js" ! -name "*.test.js" -print0 | xargs -0 -n1 node --check
