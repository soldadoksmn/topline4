name: Android build

on:
  push:
    branches: [main]
    paths:
      - "ToplineAndroid/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "ToplineAndroid/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: ToplineAndroid
        run: chmod +x gradlew && ./gradlew --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: topline4-debug-apk
          path: ToplineAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
