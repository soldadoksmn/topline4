name: Android build

on:
  push:
    branches: [main]
    paths:
      - "ToplineAndroid/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "ToplineAndroid/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: ToplineAndroid
        run: chmod +x gradlew && ./gradlew --no-daemon :app:assembleDebug
      - name: Locate and stage debug APK
        shell: bash
        run: |
          echo "Searching for generated APK files..."
          find ToplineAndroid -type f -name "*.apk" -print
          APK_PATH="$(find ToplineAndroid -type f -path "*/build/outputs/apk/*/*.apk" -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::Gradle reported a successful build, but no APK file was found under ToplineAndroid."
            exit 1
          fi
          mkdir -p artifacts
          cp "$APK_PATH" artifacts/topline4-debug.apk
          echo "Staged APK: $APK_PATH"
          ls -lh artifacts/topline4-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: topline4-debug-apk
          path: artifacts/topline4-debug.apk
          if-no-files-found: error
          retention-days: 14
